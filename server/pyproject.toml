[project]
name = "concierge"
version = "0.1.0"
description = "Family concierge agent server (FastAPI + PydanticAI + PostgreSQL + Qdrant)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "pydantic-ai>=1,<2",
    "fastmcp>=3.4,<4",
    "qdrant-client>=1.12,<2",
    "python-multipart>=0.0.21",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "aiogram>=3,<4",
    "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[project.scripts]
concierge = "concierge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]
